spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/project?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    username: root
    password: caohoncanui1
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: "yyyy-MM-dd'T'HH:mm:ss"

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway quản lý schema, JPA chỉ validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true       # Nếu DB đã tồn tại, tự set baseline
    validate-on-migrate: false       # Bỏ qua checksum validation khi migration file thay đổi
    out-of-order: true               # Cho phép migration chạy không theo thứ tự

server:
  port: 8080
  servlet:
    context-path: /api

# JWT config (dùng ở Phase 2)
app:
  jwt:
    secret: "your-very-long-secret-key-must-be-at-least-256-bits-long-for-hs256"
    access-token-expiration: 900000       # 15 phút (ms)
    refresh-token-expiration: 604800000   # 7 ngày (ms)


