<div class="min-h-screen w-full flex items-center justify-center p-4 bg-slate-50 text-slate-800 font-sans">
  <!-- Center Card Container -->
  <div class="w-full max-w-[420px] flex flex-col gap-4">
    <!-- Main Card -->
    <div class="p-8 sm:p-9 rounded-3xl bg-white border border-slate-200/80 shadow-xl shadow-slate-200/50">
      <!-- Brand Header -->
      <div class="text-center mb-6">
        <div class="w-13 h-13 mx-auto mb-3.5 rounded-2xl bg-sky-50 border border-sky-100 flex items-center justify-center text-xl text-sky-600 shadow-sm">
          <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1 class="text-2xl font-bold tracking-tight text-slate-800 mb-1">
          Đăng nhập hệ thống
        </h1>
        <p class="text-xs text-slate-500">
          Hệ thống quản lý phân quyền
        </p>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="flex flex-col gap-4">
        <!-- Username Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5" for="username">
            Tên tài khoản
          </label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            #usernameInput="ngModel"
            required
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50/80 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-100 transition text-sm disabled:opacity-50"
            placeholder="Nhập tên tài khoản (ví dụ: admin)"
            [disabled]="loading"
          />
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5" for="password">
            Mật khẩu
          </label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              #passwordInput="ngModel"
              required
              class="w-full px-3.5 py-2.5 pr-10 rounded-xl bg-slate-50/80 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-100 transition text-sm disabled:opacity-50"
              placeholder="••••••••"
              [disabled]="loading"
            />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition p-1 cursor-pointer"
              (click)="showPassword = !showPassword"
              aria-label="Toggle password visibility"
            >
              <i [class]="showPassword ? 'fa-solid fa-eye-slash text-xs' : 'fa-solid fa-eye text-xs'"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="login-submit-btn"
          class="w-full mt-2 py-2.5 px-4 rounded-xl bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-semibold text-sm shadow-md shadow-sky-500/20 transition disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2 cursor-pointer"
          [disabled]="loading || !loginForm.form.valid"
        >
          @if (loading) {
            <i class="fa-solid fa-circle-notch animate-spin text-sm"></i>
            <span>Đang xác thực...</span>
          } @else {
            <span>Đăng nhập hệ thống</span>
          }
        </button>
      </form>

      <!-- Fast Demo Credentials Picker -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <div class="text-[11px] font-semibold text-slate-500 mb-2">
          Tài khoản mẫu
        </div>

        <button
          type="button"
          class="w-full p-3 bg-slate-50 hover:bg-sky-50/60 border border-slate-200/80 hover:border-sky-300 rounded-2xl flex items-center justify-between text-xs transition cursor-pointer text-left"
          (click)="fillDemo('admin', 'Admin@123', 'Super Admin')"
        >
          <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-lg bg-sky-100 text-sky-600 flex items-center justify-center text-xs">
              <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
              <div class="font-semibold text-slate-800 text-xs">admin</div>
              <div class="text-[11px] text-slate-500">Admin@123</div>
            </div>
          </div>
          <span class="px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-700 font-semibold text-[10px] border border-sky-200">
            Admin
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
